# One-click deploy to Render (https://render.com)
# Click "New Web Service" > connect repo > select server/ directory
#
# NOT APPLIED TO THE RUNNING SERVICE. Read this before trusting anything below it.
#
# The live Render service was created through the dashboard rather than from this
# blueprint, and its environment was completely empty until HOST_TOKEN_SECRET was set by
# hand through the API. None of the values declared here have ever been in effect. That
# broke nothing, because every one of them has a sensible default in code and
# TRUSTED_PROXY_HOPS defaults to 1, which is correct for Render. It does mean this file
# is a statement of intent and not a description of what is running, so do not read a
# value here and conclude the service has it.
#
# Two ways to make it true, and either is fine as long as the file stops lying:
#   1. Recreate the service from this blueprint, at which point these values take effect
#      and HOST_TOKEN_SECRET is minted fresh, which logs out every host token in flight.
#   2. Set them by hand on the existing service to match, and delete this notice.
#
# Cloudflare is the primary relay either way. Render is the fallback, and it is what every
# already-installed copy is still talking to, so it does not get to rot.
services:
  - type: web
    name: watch-together-server
    runtime: node
    plan: free
    buildCommand: npm ci --production
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 3000
      - key: MAX_ROOMS
        value: 10000
      - key: MAX_ROOM_MEMBERS
        value: 50
      # Signs the host tokens that let someone reclaim their own room after a reload, and
      # that stop a stranger claiming host by rebuilding a room they merely know the code
      # for. generateValue makes Render mint it once and keep it stable across deploys,
      # which is the point: a secret that changed on every deploy would silently disable
      # host reclaim exactly when it is needed, since a restart is when rooms get rebuilt.
      # Without it the server still runs and simply never restores host, which is the safe
      # direction to fail.
      - key: HOST_TOKEN_SECRET
        generateValue: true
      # Number of proxies in front of this process that append to X-Forwarded-For. Render
      # terminates TLS and adds exactly one. Reading the wrong end of that header is how
      # a client forges its own address and walks past every per-IP limit.
      - key: TRUSTED_PROXY_HOPS
        value: 1
    healthCheckPath: /health
