name: CI

# Everything that can be checked without a human, checked on every push.
#
# This exists because the test suite was good and nothing ran it. The Firefox background
# script had silently dropped three inbound message types and two create-room fields, and
# the browser harness could not even start on a fresh machine because Chrome was missing.
# Both would have been caught the day they landed by a job like this one.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A newer push makes an in-flight run pointless. Cancel it rather than paying for both.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Lint, types, and house rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Install server deps
        # server.js requires `ws`, and the typecheck follows that import. Without this the
        # types job fails on a missing module rather than on anything about our code.
        run: npm ci --prefix server
      - name: Lint
        run: npm run lint
      - name: Typecheck every surface
        run: npm run typecheck
      - name: No em dashes anywhere
        # A house rule, mechanically enforced. A rule nothing checks is a suggestion.
        run: npm run check:dashes
      - name: Manifests agree on the version
        run: node scripts/check-version.mjs

  server:
    name: Server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm ci --prefix server
      - name: Node protocol and logic tests
        run: npm --prefix server run test:node
      - name: Vitest suite
        run: npm --prefix server run test:vitest

  worker:
    name: Cloudflare worker tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --prefix server-cf
      - run: npm ci --prefix server
      - run: npm --prefix server-cf test
      - run: npm --prefix server-cf run test:integration

  browser:
    name: Two-browser sync harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --prefix server
      - name: Install Chrome for Puppeteer
        # Not implied by the install. Without this the harness reports 5 tests "skipped"
        # and exits non-zero in a way that reads like a pass at a glance.
        run: npx --prefix server puppeteer browsers install chrome
      - name: Website layout and demo under production headers
        run: npm run check:site
      - name: Real two-profile sync test
        run: npm --prefix server run test:browser
        env:
          WT_SCREENSHOTS_DIR: ${{ runner.temp }}/watch-together-shots
      - name: Record real YouTube qualification and external blockers
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        run: node server/provider.test.mjs
        env:
          WT_PROVIDER_REPORT: ${{ runner.temp }}/watch-together-shots/provider-qualification.json
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: browser-screenshots
          path: ${{ runner.temp }}/watch-together-shots
          if-no-files-found: warn

      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: site-layout-screenshots
          path: .firecrawl/site-layout
          include-hidden-files: true
          if-no-files-found: error

  firefox:
    name: Firefox MV2 qualification
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --prefix server
      - name: Install stable Firefox for Marionette
        run: npx --prefix server puppeteer browsers install firefox@stable
      - name: Real Firefox extension, popup and playback qualification
        run: npm --prefix server run test:firefox
        env:
          WT_SCREENSHOTS_DIR: ${{ runner.temp }}/watch-together-firefox
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: firefox-screenshots
          path: ${{ runner.temp }}/watch-together-firefox
          if-no-files-found: warn

  package:
    name: Store package builds and is clean
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
      - name: Build both store packages
        run: node scripts/package.mjs
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: extension-packages
          path: dist/*.zip
          if-no-files-found: error
